<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Страница не найдена — ГенСервис</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/assets/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <style>
    :root{--accent:#e30613;--accent-h:#c0050f;--dark:#141417;--text:#505056;--muted:#86868b;--bg-soft:#f6f6f9}
    *,*::before,*::after{box-sizing:border-box}
    html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
    body{margin:0;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--text);background:#fff}
    header{padding:20px max(20px,env(safe-area-inset-left));border-bottom:1px solid #e8e9ee}
    .logo{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:22px;letter-spacing:-.02em;color:var(--dark);text-decoration:none}
    .logo b{font-weight:inherit} .logo span{color:var(--accent)}
    main{flex:1;display:flex;align-items:center;justify-content:center;padding:48px 20px;text-align:center}
    .code{font-size:clamp(88px,22vw,160px);font-weight:800;line-height:1;margin:0;color:var(--dark);letter-spacing:-.04em}
    .code span{color:var(--accent)}
    h1{font-size:clamp(22px,4.5vw,30px);color:var(--dark);margin:16px 0 8px;line-height:1.2}
    p{margin:0 auto 24px;max-width:440px;line-height:1.6}
    .btns{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
    .btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 24px;border-radius:999px;font-weight:600;font-size:16px;text-decoration:none;transition:background .2s}
    .btn--primary{background:var(--accent);color:#fff}.btn--primary:hover{background:var(--accent-h)}
    .btn--soft{background:var(--bg-soft);color:var(--dark)}.btn--soft:hover{background:#ececf1}
    footer{padding:20px;text-align:center;font-size:14px;color:var(--muted)}
    footer a{color:inherit}
  </style>
</head>
<body>
  <header><a class="logo" href="/"><img src="/assets/favicon.svg" alt="" width="28" height="28"><b><span>Ген</span>Сервис</b></a></header>
  <main>
    <div>
      <p class="code" aria-hidden="true">4<span>0</span>4</p>
      <h1>Такой страницы нет</h1>
      <p>Возможно, ссылка устарела или в адресе опечатка. Вернитесь на главную или позвоните нам — подскажем.</p>
      <div class="btns">
        <a class="btn btn--primary" href="/">На главную</a>
        <a class="btn btn--soft" href="tel:+375296348444">+375 (29) 634-84-44</a>
      </div>
    </div>
  </main>
  <footer>ГенСервис · Минск, ул. Кальварийская, 33, корп. 14 · ежедневно 09:30–20:00</footer>
</body>
</html>
